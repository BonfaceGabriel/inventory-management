services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/certs:/etc/nginx/certs:ro
      - ./backend/media:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - inventory-network
    restart: unless-stopped

  web:
    build: ./backend
    entrypoint: ["/app/entrypoint.sh"]
    command: daphne -b 0.0.0.0 -p 8000 management.asgi:application
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - RUN_MIGRATIONS=true
      - TZ=Africa/Nairobi
      - APP_LOG_LEVEL=DEBUG
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import socket; s=socket.create_connection((''127.0.0.1'', 8000), 2); s.close()"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - inventory-network

  db:
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - inventory-network

  redis:
    image: redis:6.2-alpine
    command: redis-server --timeout 0 --tcp-keepalive 60 --maxclients 1000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - inventory-network

  celery:
    build: ./backend
    entrypoint: []
    command: celery -A management worker --pool threads --beat -l info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - TZ=Africa/Nairobi
    depends_on:
      - redis
      - db
      - web
    networks:
      - inventory-network

  telegram-bot:
    build: ./backend
    entrypoint: []
    command: python manage.py run_bot
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - TZ=Africa/Nairobi
      - APP_LOG_LEVEL=INFO
    depends_on:
      - redis
      - db
    restart: unless-stopped
    networks:
      - inventory-network

  # frontend:
  #   build: ./frontend
