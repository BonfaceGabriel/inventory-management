version: "3.8"

services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./backend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/staticfiles:/app/staticfiles:ro
      - ./backend/media:/app/media:ro
    depends_on:
      web:
        condition: service_started
    networks:
      - dokploy-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.eagleshop.cloud`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=80"

  redis:
    image: redis:6.2-alpine
    networks:
      - dokploy-network
    restart: unless-stopped

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: daphne -b 0.0.0.0 -p 8000 management.asgi:application
    volumes:
      - ./backend/staticfiles:/app/staticfiles
      - ./backend/media:/app/media
    environment:
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=5432
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://api.eagleshop.cloud}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - PAYMENT_RELAY_SECRET=${PAYMENT_RELAY_SECRET}
      - PAYMENT_RELAY_TARGETS=${PAYMENT_RELAY_TARGETS}
      - PAYMENT_RELAY_GATEWAY_TYPES=${PAYMENT_RELAY_GATEWAY_TYPES}
      - BRANCH_NAME=${BRANCH_NAME}
      - VITE_INVENTORY_API_KEY=${VITE_INVENTORY_API_KEY}
    depends_on:
      - redis
    networks:
      - dokploy-network
    restart: unless-stopped

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A management worker --pool threads --beat -l info
    environment:
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=5432
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - PAYMENT_RELAY_SECRET=${PAYMENT_RELAY_SECRET}
      - PAYMENT_RELAY_TARGETS=${PAYMENT_RELAY_TARGETS}
      - PAYMENT_RELAY_GATEWAY_TYPES=${PAYMENT_RELAY_GATEWAY_TYPES}
      - BRANCH_NAME=${BRANCH_NAME}
    depends_on:
      - redis
    networks:
      - dokploy-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  dokploy-network:
    external: true
