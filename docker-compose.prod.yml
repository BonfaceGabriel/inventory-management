version: "3.8"

services:
  redis:
    image: redis:6.2-alpine
    command: redis-server --timeout 0 --tcp-keepalive 60 --maxclients 1000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - dokploy-network
    restart: unless-stopped

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: daphne -b 0.0.0.0 -p 8000 management.asgi:application
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=5432
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://api.eagleshop.cloud}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - CHANNELS_REDIS_PREFIX=${CHANNELS_REDIS_PREFIX:-asgi}
      - PAYMENT_RELAY_SECRET=${PAYMENT_RELAY_SECRET}
      - PAYMENT_RELAY_TARGETS=${PAYMENT_RELAY_TARGETS}
      - PAYMENT_RELAY_GATEWAY_TYPES=${PAYMENT_RELAY_GATEWAY_TYPES}
      - BRANCH_NAME=${BRANCH_NAME}
      - VITE_INVENTORY_API_KEY=${VITE_INVENTORY_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USER_IDS=${TELEGRAM_ALLOWED_USER_IDS}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_WEBHOOK_URL=${TELEGRAM_WEBHOOK_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_MODEL=${LLM_MODEL}
      - CONVERSATION_MEMORY_REDIS_URL=${CONVERSATION_MEMORY_REDIS_URL}
    depends_on:
      - redis
    networks:
      - dokploy-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.eagleshop.cloud`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A management worker --pool threads -l info
    environment:
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=5432
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - CHANNELS_REDIS_PREFIX=${CHANNELS_REDIS_PREFIX:-asgi}
      - PAYMENT_RELAY_SECRET=${PAYMENT_RELAY_SECRET}
      - PAYMENT_RELAY_TARGETS=${PAYMENT_RELAY_TARGETS}
      - PAYMENT_RELAY_GATEWAY_TYPES=${PAYMENT_RELAY_GATEWAY_TYPES}
      - BRANCH_NAME=${BRANCH_NAME}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USER_IDS=${TELEGRAM_ALLOWED_USER_IDS}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - CONVERSATION_MEMORY_REDIS_URL=${CONVERSATION_MEMORY_REDIS_URL}
    depends_on:
      - redis
    networks:
      - dokploy-network
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A management beat -l info
    environment:
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=5432
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - CHANNELS_REDIS_PREFIX=${CHANNELS_REDIS_PREFIX:-asgi}
      - PAYMENT_RELAY_SECRET=${PAYMENT_RELAY_SECRET}
      - PAYMENT_RELAY_TARGETS=${PAYMENT_RELAY_TARGETS}
      - PAYMENT_RELAY_GATEWAY_TYPES=${PAYMENT_RELAY_GATEWAY_TYPES}
      - BRANCH_NAME=${BRANCH_NAME}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USER_IDS=${TELEGRAM_ALLOWED_USER_IDS}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - CONVERSATION_MEMORY_REDIS_URL=${CONVERSATION_MEMORY_REDIS_URL}
    depends_on:
      - redis
    networks:
      - dokploy-network
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  dokploy-network:
    external: true
