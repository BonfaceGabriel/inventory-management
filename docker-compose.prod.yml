version: "3.8"

services:
  redis:
    image: redis:6.2-alpine
    networks:
      - dokploy-network
    restart: unless-stopped

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "
      echo 'Waiting for database at $$DATABASE_HOST:5432...' &&
      python -c '
      import socket
      import time
      import sys
      import os

      host = os.environ.get(\"DATABASE_HOST\", \"db\")
      port = 5432
      max_retries = 30

      for i in range(max_retries):
          try:
              sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              sock.settimeout(2)
              result = sock.connect_ex((host, port))
              sock.close()
              if result == 0:
                  print(f\"Database is ready at {host}:{port}!\")
                  sys.exit(0)
          except Exception as e:
              pass
          print(f\"Database unavailable (attempt {i+1}/{max_retries}) - sleeping...\")
          time.sleep(2)

      print(\"Database failed to become ready\")
      sys.exit(1)
      ' &&
      echo 'Running migrations...' &&
      python manage.py migrate &&
      echo 'Collecting static files...' &&
      python manage.py collectstatic --noinput &&
      echo 'Starting Daphne server...' &&
      daphne -b 0.0.0.0 -p 8000 management.asgi:application
      "
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=5432
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://api.eagleshop.cloud}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - dokploy-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.eagleshop.cloud`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A management worker -l info
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=5432
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - dokploy-network
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  dokploy-network:
    external: true
