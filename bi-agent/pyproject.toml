[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-bi-agent"
version = "0.1.0"
description = "A small Pydantic AI agent backed by authenticated inventory APIs"
requires-python = ">=3.12"
dependencies = ["pydantic-ai-slim[openai]==2.69.0", "httpx>=0.28,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
whatsapp-bi = "whatsapp_bi.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
